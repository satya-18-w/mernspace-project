apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: ecr-pull
      initContainers:
        - name: migrate
          image: mernspace/auth:latest
          imagePullPolicy: Always
          command:
            - node
            - node_modules/typeorm/cli.js
            - migration:run
            - -d
            - src/config/data-source.js
          env:
            - name: NODE_ENV
              value: production
            - name: DB_HOST
              valueFrom:
                secretKeyRef: {name: auth-env, key: DB_HOST}
            - name: DB_PORT
              valueFrom:
                secretKeyRef: {name: auth-env, key: DB_PORT}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: auth-env, key: DB_USERNAME}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: auth-env, key: DB_PASSWORD}
            - name: DB_NAME
              valueFrom:
                secretKeyRef: {name: auth-env, key: DB_NAME}
      containers:
        - name: auth
          image: mernspace/auth:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5501
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5501"
            - name: DB_HOST
              valueFrom:
                secretKeyRef: {name: auth-env, key: DB_HOST}
            - name: DB_PORT
              valueFrom:
                secretKeyRef: {name: auth-env, key: DB_PORT}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: auth-env, key: DB_USERNAME}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: auth-env, key: DB_PASSWORD}
            - name: DB_NAME
              valueFrom:
                secretKeyRef: {name: auth-env, key: DB_NAME}
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef: {name: auth-env, key: REFRESH_TOKEN_SECRET}
            - name: JWKS_URI
              value: http://auth-service:5501/.well-known/jwks.json
            - name: CLIENT_UI_DOMAIN
              valueFrom:
                configMapKeyRef: {name: mernspace-runtime, key: PUBLIC_ORIGIN}
            - name: ADMIN_UI_DOMAIN
              valueFrom:
                configMapKeyRef: {name: mernspace-runtime, key: PUBLIC_ORIGIN}
            - name: MAIN_DOMAIN
              value: ""
          volumeMounts:
            - name: certs
              mountPath: /app/certs
              readOnly: true
            - name: jwks
              mountPath: /app/public/.well-known
              readOnly: true
          readinessProbe:
            httpGet: {path: /, port: 5501}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 5501}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: certs
          secret: {secretName: auth-certs}
        - name: jwks
          configMap: {name: auth-jwks}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 5501
      targetPort: 5501
