worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 2m;

    upstream auth_service    { server auth-service:5501; }
    upstream catalog_service { server catalog-service:5502; }
    upstream order_service   { server order-service:5503; }
    upstream ws_service      { server ws-service:5504; }
    upstream client_ui       { server client-ui:3000; }
    upstream admin_ui        { server admin-ui:80; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js internal auth helpers must win over the /api/auth proxy below.
        location = /api/auth/accessToken {
            proxy_pass http://client_ui;
        }

        location = /api/auth/refresh {
            proxy_pass http://client_ui;
        }

        # Auth service (strip /api/auth prefix)
        location /api/auth/ {
            proxy_pass http://auth_service/;
        }

        # Catalog service (strip /api/catalog prefix)
        location /api/catalog/ {
            proxy_pass http://catalog_service/;
        }

        # Order service (strip /api/order prefix)
        location /api/order/ {
            proxy_pass http://order_service/;
        }

        # Socket.IO / WebSocket upgrade
        location /socket.io/ {
            proxy_pass http://ws_service;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Admin SPA (built with base /admin/)
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin_ui;
        }

        # Next.js client application
        location / {
            proxy_pass http://client_ui;
        }
    }
}
