name: mernspace-local

x-backend-env: &backend-env
  NODE_ENV: production

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mernspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mernspace}
      POSTGRES_DB: ${POSTGRES_DB:-mernspace_auth}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mernspace} -d ${POSTGRES_DB:-mernspace_auth}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mernspace]

  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mernspace]

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/mongo-init.sh"]
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"
    networks: [mernspace]

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [mernspace]

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'for t in product topping order; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1; done'
    restart: "no"
    networks: [mernspace]

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    networks: [mernspace]

  auth-service:
    build:
      context: ../../mernspace-c-auth-service
      dockerfile: ../infra/local/Dockerfile.backend
      args:
        START_FILE: src/server.js
    image: mernspace/auth:latest
    environment:
      <<: *backend-env
      PORT: "5501"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-mernspace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mernspace}
      DB_NAME: ${POSTGRES_DB:-mernspace_auth}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-me-local-refresh-secret}
      JWKS_URI: http://auth-service:5501/.well-known/jwks.json
      CLIENT_UI_DOMAIN: ${PUBLIC_CLIENT_URL:-http://localhost:8080}
      ADMIN_UI_DOMAIN: ${PUBLIC_ADMIN_URL:-http://localhost:8080}
      MAIN_DOMAIN: ""
    volumes:
      - ./secrets/auth/certs:/app/certs:ro
      - ./secrets/auth/public:/app/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5501/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [mernspace]

  auth-migrate:
    image: mernspace/auth:latest
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "src/config/data-source.js"]
    environment:
      <<: *backend-env
      PORT: "5501"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-mernspace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mernspace}
      DB_NAME: ${POSTGRES_DB:-mernspace_auth}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-me-local-refresh-secret}
      JWKS_URI: http://auth-service:5501/.well-known/jwks.json
      CLIENT_UI_DOMAIN: ${PUBLIC_CLIENT_URL:-http://localhost:8080}
      ADMIN_UI_DOMAIN: ${PUBLIC_ADMIN_URL:-http://localhost:8080}
      MAIN_DOMAIN: ""
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mernspace]

  auth-seed:
    image: mernspace/auth:latest
    command: ["node", "seed-admin.js"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-mernspace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mernspace}
      DB_NAME: ${POSTGRES_DB:-mernspace_auth}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mernspace.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Demo}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Admin}
      TENANT_NAME: ${TENANT_NAME:-Demo Restaurant}
      TENANT_ADDRESS: ${TENANT_ADDRESS:-1 Demo Street}
    volumes:
      - ./scripts/seed-admin.js:/app/seed-admin.js:ro
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [mernspace]

  catalog-service:
    build:
      context: ../../mernspace-c-catalog-service
      dockerfile: ../infra/local/Dockerfile.backend
      args:
        START_FILE: src/server.js
    image: mernspace/catalog:latest
    environment: *backend-env
    volumes:
      - ./config/catalog:/app/config:ro
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5502/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [mernspace]

  order-service:
    build:
      context: ../../mernspace-c-order-service
      dockerfile: ../infra/local/Dockerfile.backend
      args:
        START_FILE: server.js
    image: mernspace/order:latest
    environment: *backend-env
    volumes:
      - ./config/order:/app/config:ro
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5503/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [mernspace]

  notification-service:
    build:
      context: ../../mernspace-c-notification-service
      dockerfile: ../infra/local/Dockerfile.backend
      args:
        START_FILE: server.js
    image: mernspace/notification:latest
    environment: *backend-env
    volumes:
      - ./config/notification:/app/config:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks: [mernspace]

  ws-service:
    build:
      context: ../../mernspace-c-ws-service
      dockerfile: ../infra/local/Dockerfile.backend
      args:
        START_FILE: server.js
    image: mernspace/ws:latest
    environment: *backend-env
    volumes:
      - ./config/ws:/app/config:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks: [mernspace]

  client-ui:
    build:
      context: ../../mernspace-c-client-ui
      dockerfile: ../infra/local/Dockerfile.client-ui
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_CLIENT_URL:-http://localhost:8080}
    image: mernspace/client-ui:latest
    environment:
      NODE_ENV: production
      BACKEND_URL: http://gateway
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks: [mernspace]

  admin-ui:
    build:
      context: ../../mernspace-c-admin-ui
      dockerfile: ../infra/local/Dockerfile.admin-ui
      args:
        VITE_BACKEND_API_URL: ${PUBLIC_CLIENT_URL:-http://localhost:8080}
        VITE_SOCKET_SERVICE_URL: ${PUBLIC_CLIENT_URL:-http://localhost:8080}
        VITE_BASE_PATH: /admin/
    image: mernspace/admin-ui:latest
    networks: [mernspace]

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - ws-service
      - client-ui
      - admin-ui
    networks: [mernspace]

volumes:
  postgres-data:
  mongo-data:
  kafka-data:

networks:
  mernspace:
    driver: bridge
